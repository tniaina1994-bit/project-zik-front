<div class="page">
  <div class="page-header">
    <h1>Albums</h1>
    <button class="btn btn-primary" (click)="openCreate()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Ajouter
    </button>
  </div>

  @if (showForm) {
    <div class="modal-overlay" (click)="cancel()">
      <div class="modal" (click)="$event.stopPropagation()">
        <div class="modal-header">
          <h2>{{ editing ? 'Modifier' : 'Ajouter' }} un album</h2>
          <button class="btn-close" (click)="cancel()">&times;</button>
        </div>
        <form [formGroup]="form" (ngSubmit)="submit()">
          <div class="modal-body">
            <div class="form-row">
              <div class="form-group">
                <label>Titre</label>
                <input formControlName="title" placeholder="Nevermind" />
              </div>
              <div class="form-group">
                <label>Slug</label>
                <input formControlName="slug" placeholder="nevermind" />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Artiste</label>
                <select formControlName="artist_id">
                  <option value="">Sélectionner...</option>
                  @for (a of artists; track a.id) {
                    <option [value]="a.id">{{ a.name }}</option>
                  }
                </select>
              </div>
              <div class="form-group">
                <label>Année</label>
                <input type="number" formControlName="release_year" />
              </div>
            </div>
            <div class="form-group">
              <label>Image URL</label>
              <input formControlName="cover_image" placeholder="https://..." />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" (click)="cancel()">Annuler</button>
            <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
              {{ editing ? 'Modifier' : 'Créer' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  }

  <div class="card-grid">
    @for (album of albums; track album.id) {
      <div class="card" [routerLink]="['/albums', album.id]">
        <div class="card-img" [style.background-image]="'url(' + (album.cover_image || 'https://via.placeholder.com/300x200/1a1a2e/666?text=' + album.title.charAt(0)) + ')'">
          <div class="card-year">{{ album.release_year }}</div>
        </div>
        <div class="card-body">
          <h3>{{ album.title }}</h3>
          <p class="card-subtitle">{{ getArtistName(album.artist_id) }}</p>
        </div>
        <div class="card-actions" (click)="$event.stopPropagation()">
          <button class="btn btn-sm btn-edit" (click)="openEdit(album)">Modifier</button>
          <button class="btn btn-sm btn-delete" (click)="delete(album.id)">Supprimer</button>
        </div>
      </div>
    } @empty {
      <div class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity: 0.3"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/></svg>
        <p>Aucun album pour le moment</p>
      </div>
    }
  </div>
</div>
