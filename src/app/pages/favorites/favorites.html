<div class="page">
  <div class="page-header">
    <h1>Favoris</h1>
  </div>

  <div class="card-grid">
    @for (track of tracks; track track.id) {
      <div class="card">
        <div class="card-body">
          <div class="track-header">
            <h3>{{ track.title }}</h3>
            <button class="btn-fav" (click)="remove(track.id)" title="Retirer des favoris">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--accent)" stroke="var(--accent)" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </button>
          </div>
          <p class="card-subtitle">{{ getArtistName(track.artist_id) }}</p>
          <span class="duration">{{ formatDuration(track.duration) }}</span>
        </div>
        <div class="card-actions">
          <button class="btn btn-sm btn-delete" (click)="remove(track.id)">Retirer</button>
        </div>
      </div>
    } @empty {
      <div class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity: 0.3"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <p>Aucun favori pour le moment</p>
      </div>
    }
  </div>
</div>
